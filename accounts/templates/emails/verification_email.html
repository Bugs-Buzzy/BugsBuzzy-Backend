<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تایید - باگزبازی</title>
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #0B1F47, #17789B); font-family: Tahoma, Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="min-height: 100vh;">
        <tr>
            <td align="center" style="padding: 20px 10px;">
                <table class="container" cellpadding="0" cellspacing="0" style="
                    max-width: 600px;
                    background: #0B1F47;
                    border-radius: 12px;
                    border: 4px solid #ce8d00;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(206,141,0,0.3);
                    overflow: hidden;
                ">
                    <tr>
                        <td align="center" style="padding: 15px 15px; background: linear-gradient(135deg, #17789B, #0B3A4B);">
                            <img class="logo" src="https://s34.picofile.com/file/8487595426/LOGO.png" alt="Logo" width="80" style="display: block; margin: 0 auto 8px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));">
                            <h1 class="header-title" style="margin: 0; color: #CEEDF7; font-size: 28px; font-weight: bold; text-shadow: 0 2px 15px rgba(46,177,224,0.6);">
                                باگزبازی
                            </h1>
                            <p class="header-subtitle" style="margin: 3px 0 0; color: #7DCEEC; font-size: 12px;">
                                رویداد بازی‌سازی دانشگاه صنعتی شریف
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 25px 20px; background: #0B1F47;">
                            <h2 class="welcome" style="color: #2EB1E0; font-size: 18px; margin: 0 0 8px; text-align: center;">
                                خوش آمدید! 🎮
                            </h2>
                            <p class="code-label" style="color: #A6DEF2; font-size: 13px; line-height: 1.5; margin: 0 0 18px; text-align: center;">
                                کد تایید شما:
                            </p>
                            <div style="text-align: center; margin-bottom: 18px;">
                                <div style="
                                    display: inline-block;
                                    background: linear-gradient(135deg, #2EB1E0, #17789B);
                                    padding: 20px 35px;
                                    border-radius: 8px;
                                    border: 3px solid #FAA61A;
                                    box-shadow: 0 8px 25px rgba(46,177,224,0.4), inset 0 0 0 1px rgba(255,255,255,0.2);
                                ">
                                    <div class="code-box" style="
                                        color: #FFFFFF;
                                        font-size: 46px;
                                        font-weight: bold;
                                        letter-spacing: 12px;
                                        font-family: 'Courier New', monospace;
                                        text-shadow: 0 3px 8px rgba(0,0,0,0.5);
                                    ">

                                        {{ verification_code }}

                                    </div>
                                </div>
                            </div>
                            <div style="
                                padding: 10px 12px;
                                background: linear-gradient(135deg, rgba(251,93,19,0.15), rgba(250,166,26,0.15));
                                border: 2px solid rgba(250,166,26,0.4);
                                border-radius: 6px;
                            ">
                                <p class="warning-text" style="margin: 0; color: #FAA61A; font-size: 11px; text-align: center; line-height: 1.5;">
                                    ⚠️ کد تا <strong>15 دقیقه</strong> معتبر است
                                </p>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 10px; background: linear-gradient(to top, #1a5a73, #0B3A4B); text-align: center; border-top: 3px solid #ce8d00;">
                            <div style="text-align: center;">
                                <a class="btn" href="https://bugsbuzzy.ir/" style="
                                    display: inline-block;
                                    margin: 4px 4px;
                                    padding: 8px 14px;
                                    color: #FFFFFF;
                                    text-decoration: none;
                                    font-size: 11px;
                                    font-weight: bold;
                                    background: rgba(46,177,224,0.2);
                                    border: 2px solid #ce8d00;
                                    border-radius: 5px;
                                ">🌐 سایت</a>
                                <a class="btn" href="https://t.me/bugsbuzzy" style="
                                    display: inline-block;
                                    margin: 4px 4px;
                                    padding: 8px 14px;
                                    color: #FFFFFF;
                                    text-decoration: none;
                                    font-size: 11px;
                                    font-weight: bold;
                                    background: rgba(46,177,224,0.2);
                                    border: 2px solid #ce8d00;
                                    border-radius: 5px;
                                ">📢 کانال تلگرام</a>
                                <a class="btn" href="https://t.me/BugsBuzzy_Support" style="
                                    display: inline-block;
                                    margin: 4px 4px;
                                    padding: 8px 14px;
                                    color: #FFFFFF;
                                    text-decoration: none;
                                    font-size: 11px;
                                    font-weight: bold;
                                    background: rgba(46,177,224,0.2);
                                    border: 2px solid #ce8d00;
                                    border-radius: 5px;
                                ">💬 پشتیبانی</a>
                            </div>
                            <img src="https://s34.picofile.com/file/8487595250/banner.png" alt="Sponsors" style="
                                max-width: 50%; 
                                height: auto;
                                margin-top: 12px;
                            ">
                        </td>
                    </tr>
                </table>
                <p class="footer-text" style="color: rgba(166,222,242,0.5); font-size: 9px; text-align: center; margin: 10px 0 0;">
                    این ایمیل به صورت خودکار ارسال شده است
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
